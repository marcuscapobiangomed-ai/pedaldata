{% assign faq_product = site.data.products.bikes[page.product_id] %}
{% if faq_product %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": {{ "Peso da " | append: faq_product.brand | append: " " | append: faq_product.model | append: "?" | jsonify }},
      "acceptedAnswer": {"@type": "Answer", "text": {% if faq_product.declaredWeight %}{{ faq_product.declaredWeight.valueKg | append: " kg (tam. " | append: faq_product.declaredWeight.size | append: ")." | jsonify }}{% else %}"Consulte o fabricante."{% endif %}}
    },
    {
      "@type": "Question",
      "name": {{ "Grupo da " | append: faq_product.brand | append: " " | append: faq_product.model | append: "?" | jsonify }},
      "acceptedAnswer": {"@type": "Answer", "text": {{ faq_product.drivetrain.brand | append: " " | append: faq_product.drivetrain.groupset | append: " (" | append: faq_product.drivetrain.speeds | append: " velocidades)." | jsonify }}}
    },
    {
      "@type": "Question",
      "name": {{ faq_product.brand | append: " " | append: faq_product.model | append: " é para iniciantes?" | jsonify }},
      "acceptedAnswer": {"@type": "Answer", "text": {% if faq_product.category contains "entry" %}"Sim, é uma bicicleta da categoria de entrada."{% else %}{{ "É uma bicicleta da categoria " | append: faq_product.category | replace: "-", " " | append: "." | jsonify }}{% endif %}}
    }
  ]
}
</script>
{% endif %}
