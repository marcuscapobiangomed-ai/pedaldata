{% assign canonical_url = page.url | absolute_url %}
{% capture category_url %}{{ site.url }}{{ site.baseurl }}/categorias#{{ post_category | slugify }}{% endcapture %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ site.url | append: site.baseurl | append: '/#organization' | jsonify }},
      "name": {{ site.organization.name | default: site.title | jsonify }},
      "url": {{ site.organization.url | default: site.url | jsonify }},
      "logo": {
        "@type": "ImageObject",
        "url": {{ site.logo | absolute_url | jsonify }}
      },
      "sameAs": {{ site.organization.same_as | default: site.social.links | jsonify }}
    },
    {
      "@type": "WebSite",
      "@id": {{ site.url | append: site.baseurl | append: '/#website' | jsonify }},
      "url": {{ site.url | append: site.baseurl | append: '/' | jsonify }},
      "name": {{ site.title | jsonify }},
      "inLanguage": {{ site.lang | jsonify }},
      "publisher": { "@id": {{ site.url | append: site.baseurl | append: '/#organization' | jsonify }} }
    },
    {
      "@type": "Article",
      "@id": {{ canonical_url | append: '#article' | jsonify }},
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "abstract": {{ page.direct_answer | default: page.description | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "mainEntityOfPage": { "@id": {{ canonical_url | jsonify }} },
      "author": { "@id": {{ site.url | append: site.baseurl | append: '/#organization' | jsonify }} },
      "publisher": { "@id": {{ site.url | append: site.baseurl | append: '/#organization' | jsonify }} },
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "inLanguage": {{ site.lang | jsonify }},
      "articleSection": {{ page.category | default: page.categories.first | default: 'Artigos' | jsonify }},
      "audience": {
        "@type": "Audience",
        "audienceType": {{ page.experience_level_target | default: site.data.audience.defaults.experienceLevelTarget | jsonify }}
      },
      "image": {{ page.image | default: site.logo | absolute_url | jsonify }},
      "citation": [{% for source in page.sources %}
        {
          "@type": "CreativeWork",
          "name": {{ source.name | default: source.url | jsonify }}{% if source.url %},
          "url": {{ source.url | jsonify }}{% endif %}
        }{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ canonical_url | append: '#breadcrumb' | jsonify }},
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Início", "item": {{ site.url | append: site.baseurl | append: '/' | jsonify }} },{% if post_category %}
        { "@type": "ListItem", "position": 2, "name": {{ post_category_label | jsonify }}, "item": {{ category_url | strip | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ canonical_url | jsonify }} }{% else %}
        { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ canonical_url | jsonify }} }{% endif %}
      ]
    }{% if page.faq and page.faq.size > 0 %},
    {
      "@type": "FAQPage",
      "@id": {{ canonical_url | append: '#faq' | jsonify }},
      "mainEntity": [{% for item in page.faq %}
        {
          "@type": "Question",
          "name": {{ item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ item.answer | jsonify }}
          }
        }{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    }{% endif %}
  ]
}
</script>
