title: "The Biker Blog"
tagline: "Ciclismo vivido, testado e explicado"
description: "O blog oficial da The Biker Shop: reviews, guias de compra, comparativos e histórias para ciclistas brasileiros"
url: "https://marcuscapobiangomed-ai.github.io"
baseurl: "/pedaldata"
lang: pt-BR

author: "Equipe The Biker Blog"
email: "atendimento@thebiker.com.br"

logo: "/assets/img/brand/the-biker-blog-logo.png"

social:
  name: The Biker Blog
  links:
    - https://www.instagram.com/thebikerbrasil

webmaster_verifications:
  google: googleae077bce8e335daa

google_analytics: G-DHD86P6XDZ

markdown: kramdown
highlighter: rouge

permalink: /:year/:month/:title/

# Metadados extras por post (usado no redesign)
# Adicionar nos posts: reading_time, image, image_alt, image_credit

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      author: "Equipe The Biker Blog"
  - scope:
      path: "_posts"
      type: posts
    values:
      image: /assets/img/brand/the-biker-blog-logo.png

exclude:
  - bot
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - scripts

paginate: 10
paginate_path: "/page/:num/"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
