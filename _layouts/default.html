<!DOCTYPE html>
<html lang="pt-BR">
<head>
  {% include head.html %}
</head>
<body>
  <div class="brand-announcement">
    <div class="container">
      <span>Conteúdo oficial da TheBiker</span>
      <a href="https://thebikershop.com.br/" target="_blank" rel="noopener">Acesse a loja</a>
    </div>
  </div>
  <nav class="site-nav">
    <div class="container site-nav-inner">
      <a href="{{ site.baseurl }}/" class="site-logo" aria-label="TheBiker Blog — início">
        <img src="{{ site.baseurl }}{{ site.logo }}" alt="TheBiker Blog" width="210" height="60">
      </a>
      <ul class="nav-links">
        <li><a href="{{ site.baseurl }}/categorias">Artigos</a></li>
        <li><a href="{{ site.baseurl }}/categorias#reviews">Reviews</a></li>
        <li><a href="{{ site.baseurl }}/categorias#comparativo">Comparativos</a></li>
        <li><a href="{{ site.baseurl }}/categorias#guia-de-compra">Guias</a></li>
        <li><a href="{{ site.baseurl }}/bikes/">Bikes</a></li>
      </ul>
      <div class="nav-actions">
        <a class="nav-search" href="{{ site.baseurl }}/search" aria-label="Buscar"><i class="bi bi-search" aria-hidden="true"></i></a>
        <a class="nav-shop" href="https://thebikershop.com.br/" target="_blank" rel="noopener">Ir para a loja</a>
      </div>
      <button class="menu-btn" id="menuToggle" aria-label="Menu">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
    </div>
  </nav>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}
  {% include auth-scripts.html %}
</body>
</html>
