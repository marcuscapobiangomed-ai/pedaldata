name: TheBiker — Automação editorial

on:
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar a próxima pauta sem chamar as APIs"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: thebiker-editorial-automation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
        working-directory: bot
      - name: Validar fila e configuração estrutural
        run: npm run automation:doctor
        working-directory: bot

  generate-draft:
    needs: preflight
    if: ${{ vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: editorial-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
        working-directory: bot
      - name: Processar no máximo uma pauta
        id: automation
        env:
          AUTOMATION_ENABLED: "true"
          AUTOMATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          AI_PIPELINE_MODE: three-provider
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '1.60' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.THEBIKER_GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: main
        run: npm run automation:run
        working-directory: bot
      - name: Resumo operacional
        if: always()
        run: |
          echo "### Automação editorial TheBiker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Estado: ${{ steps.automation.outputs.status || 'falha antes do resultado' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: ${{ steps.automation.outputs.pr_url || 'nenhum' }}" >> "$GITHUB_STEP_SUMMARY"

  disabled-notice:
    needs: preflight
    if: ${{ vars.AUTOMATION_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automação editorial validada, porém pausada pela variável AUTOMATION_ENABLED."
