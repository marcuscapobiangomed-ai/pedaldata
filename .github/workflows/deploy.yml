name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install validation dependencies
        run: |
          npm ci
          npm ci --prefix bot

      - name: Run publication gates
        run: npm run validate

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Security gate for public artifact
        run: npm run security:public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verificar site publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error --location --max-time 20 "$SITE_URL" || true)"
            if echo "$body" | grep -qi "thebiker"; then
              echo "Site publicado e identidade TheBiker encontrada em $SITE_URL"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Deploy concluido, mas o health check publico falhou: $SITE_URL" >&2
          exit 1
