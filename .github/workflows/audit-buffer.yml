name: TheBiker — Auditoria final do buffer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thebiker-editorial-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: editorial-automation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
        working-directory: bot
      - name: Auditar todos os posts sem nota editorial final
        continue-on-error: true
        id: audit
        env:
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '1.60' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run campaign:audit-buffer
        working-directory: bot
      - name: Persistir notas e bloqueios
        if: always()
        run: |
          git config user.name "thebiker-editorial-bot"
          git config user.email "thebiker-editorial-bot@users.noreply.github.com"
          git add bot/editorial-campaign.json bot/operational-state _data/editorial-calendar.json
          git diff --cached --quiet || git commit -m "audit: revisar buffer editorial"
          git pull --rebase origin main
          git push
      - name: Propagar resultado
        if: steps.audit.outcome == 'failure'
        run: exit 1
